<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AJN Hourly Video Archive - Phase 1 MVP</title>

<!-- CSS -->
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/components/now-playing.css">
</head>
<body>

<!-- STICKY HEADER -->
<header class="sticky-header">
    <div class="header-content">
        <div class="logo">
            <h1>🎙️ AJN Hourly Archive</h1>
            <span class="logo-badge">Central Time</span>
        </div>
        <div class="header-controls">
            <button id="darkModeToggle" class="btn btn-secondary" aria-label="Toggle dark mode">🌙 Dark</button>
        </div>
    </div>
</header>

<!-- MAIN CONTAINER -->
<main class="container">
    <!-- TWO-COLUMN GRID LAYOUT (65% / 35%) -->
    <div class="main-grid">
        
        <!-- LEFT COLUMN (65%) - NOW PLAYING CARD COMPONENT -->
        <div class="video-section">
            <div class="now-playing-card">
                <div class="now-playing-label">▶ NOW PLAYING</div>
                <div class="now-playing-title" id="currentTitle" aria-live="polite">Select an episode to begin</div>
                
                <div class="video-container" id="videoThumbnailContainer" style="cursor: pointer;">
                    <video id="videoPlayer" preload="metadata" aria-label="Video player">
                        <source src="" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>
                    <div class="immersive-overlay-btn" id="immersiveViewBtn" title="Open Immersive View" aria-label="Enter fullscreen mode">📺</div>
                </div>

                <div class="controls-ui">
                    <div class="progress-container">
                        <input type="range" id="progressBar" value="0" max="100" step="0.1" aria-label="Video progress" style="width: 100%; margin-bottom: 10px;">
                        <div class="time-display">
                            <span id="currentTime">0:00</span>
                            <span id="duration">0:00</span>
                        </div>
                    </div>
                    
                    <div class="video-controls-row">
                        <button id="playPauseBtn" class="btn btn-secondary" aria-label="Play or pause video">⏯ Play</button>
                        <button id="skipBackBtn" class="btn btn-secondary" aria-label="Skip back 10 seconds">⏪ 10s</button>
                        <button id="skipForwardBtn" class="btn btn-secondary" aria-label="Skip forward 10 seconds">⏩ 10s</button>
                        <label class="btn btn-secondary" aria-label="Autoplay toggle">
                            <input type="checkbox" id="autoplayToggle" checked> Autoplay
                        </label>
                        <button id="downloadBtn" class="btn btn-secondary" aria-label="Download episode">⬇️</button>
                        <button id="shareBtn" class="btn btn-secondary" aria-label="Share episode">📤</button>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- RIGHT COLUMN (35%) - PLAYLIST (STICKY) -->
        <div class="playlist-section">
            <div class="playlist-header">
                <h2>📋 Playlist</h2>
                <div class="playlist-stats" id="playlistStats" aria-live="polite">Loading episodes...</div>
            </div>
            <div class="playlist-container" id="playlistContainer">
                <div class="loading-state">
                    <div class="loader"></div>
                    <div class="mt-2">Loading episodes...</div>
                </div>
            </div>
        </div>
        
    </div>
</main>

<!-- JavaScript Modules -->
<script src="js/utils/helpers.js"></script>
<script src="js/utils/videoControls.js"></script>
<script src="js/components/NowPlayingCard.js"></script>
<script src="js/main.js"></script>
</body>
</html>
